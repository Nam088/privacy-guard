<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Guard</title>
    <style>
      /* Pre-size the popup window immediately so Chromium skips window resize reflow */
      html, body {
        width: 685px;
        height: 570px;
        min-width: 685px;
        min-height: 570px;
        max-width: 685px;
        max-height: 570px;
        margin: 0;
        padding: 0;
        overflow: hidden;
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        width: 685px;
        height: 570px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
