name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting & lint
        run: pnpm lint

      - name: Type check (TypeScript)
        run: pnpm compile

      - name: Run unit test suite
        run: pnpm test

  build:
    name: Build & Package Extensions
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & package extensions for all browsers
        run: pnpm zip:all

      - name: Upload Chrome extension package
        uses: actions/upload-artifact@v4
        with:
          name: privacy-guard-chrome
          path: .output/*-chrome.zip
          include-hidden-files: true
          retention-days: 14

      - name: Upload Edge extension package
        uses: actions/upload-artifact@v4
        with:
          name: privacy-guard-edge
          path: .output/*-edge.zip
          include-hidden-files: true
          retention-days: 14

      - name: Upload Firefox extension package
        uses: actions/upload-artifact@v4
        with:
          name: privacy-guard-firefox
          path: .output/*-firefox.zip
          include-hidden-files: true
          retention-days: 14
